<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Pass, Ranked</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c232c; --line: #2a323d;
    --text: #e6edf3; --muted: #8b949e; --accent: #6dc849;
    --good: #00ce7a; --mixed: #ffbd3f; --bad: #ff6874;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13,17,23,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
  .titlebar { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 16px 0 12px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.2px; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-bottom: 14px; }
  input[type="search"], select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 11px; font: inherit; font-size: 14px;
  }
  input[type="search"] { min-width: 240px; flex: 1 1 240px; }
  .lang { margin-left: auto; }
  .name-sub { color: var(--muted); font-size: 12px; font-weight: 400; }
  input[type="search"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg button {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px;
    padding: 8px 13px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }
  .playon {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 7px 12px;
  }
  .playon-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .playon label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .playon label:has(:checked) { color: var(--accent); }
  .playon input { accent-color: var(--accent); margin: 0; }
  .toggle { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 14px; cursor: pointer; }

  main { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: #3d4753; }
  .art { position: relative; aspect-ratio: 3 / 4; background: var(--panel-2); }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Bottom-left: top-left covers box-art banners such as "PLAYSTATION HITS". */
  .rank {
    position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,.72);
    border-radius: 6px; padding: 2px 7px; font-size: 12px; color: var(--muted);
  }
  .score {
    position: absolute; right: 8px; bottom: 8px; width: 38px; height: 38px;
    border-radius: 8px; display: grid; place-items: center;
    font-weight: 700; font-size: 16px; color: #05140c;
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
  }
  .score.good { background: var(--good); }
  .score.mixed { background: var(--mixed); }
  .score.bad { background: var(--bad); color: #2a0409; }
  .score.none { background: var(--panel-2); color: var(--muted); font-size: 13px; box-shadow: none; }
  .scores { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 5px; align-items: flex-end; }
  .scores .score { position: static; }
  .user {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: 12px; color: #05140c; box-shadow: 0 2px 10px rgba(0,0,0,.45);
  }
  .user.good { background: var(--good); } .user.mixed { background: var(--mixed); }
  .user.bad { background: var(--bad); color: #2a0409; }
  td.mc .pill.user { border-radius: 50%; min-width: 30px; padding: 4px 0; font-size: 12px; }
  .body { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 5px; }
  .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .sub { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: 11px; }
  .tag.tier-2 { color: #79b8ff; border-color: #24476e; }
  .tag.tier-3 { color: #e3b341; border-color: #6b5317; }
  .links { margin-top: auto; padding: 0 11px 11px; display: flex; gap: 8px; font-size: 12px; }
  .links a { color: var(--muted); border-bottom: 1px solid transparent; }
  .links a:hover { color: var(--accent); border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr:hover { background: var(--panel); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); width: 52px; }
  td.mc { font-weight: 700; width: 64px; }
  td.mc .pill { display: inline-block; min-width: 34px; text-align: center; border-radius: 6px; padding: 2px 0; color: #05140c; }
  .pill.good { background: var(--good); } .pill.mixed { background: var(--mixed); }
  .pill.bad { background: var(--bad); color: #2a0409; } .pill.none { background: var(--panel-2); color: var(--muted); }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  footer { color: var(--muted); font-size: 12px; padding: 30px 20px 50px; max-width: 1400px; margin: 0 auto; }
  .table-wrap { overflow-x: auto; }
  .filters-toggle { display: none; }

  /* Phones: the full filter bar wraps to most of the screen, so it scrolls away
     instead of sticking and folds behind a Filters button; cards go two across. */
  @media (max-width: 700px) {
    header { position: static; }
    .wrap { padding: 0 12px; }
    .titlebar { gap: 8px; padding: 12px 0 10px; }
    h1 { font-size: 16px; flex: 1 1 100%; }
    .meta { font-size: 12px; flex: 1 1 100%; }
    .lang { margin-left: 0; }
    .seg button { padding: 7px 11px; font-size: 13px; }
    .controls { gap: 8px; padding-bottom: 12px; }
    /* Search and the Filters button keep the first row to themselves. */
    input[type="search"] { min-width: calc(100% - 90px); flex: 1 1 0; }
    .filters-toggle {
      display: block; background: var(--panel); color: var(--text); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 8px 12px; font: inherit; font-size: 14px;
    }
    header:not(.open) .controls > :not(#q):not(.filters-toggle) { display: none; }
    .controls select { flex: 1 1 calc(50% - 4px); min-width: 0; }
    .playon { flex: 1 1 100%; gap: 10px; }
    .share-btn { flex: 1 1 auto; }
    main { padding: 12px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card:hover { transform: none; }
    .body { padding: 8px 9px 10px; gap: 4px; }
    .name { font-size: 13px; }
    .sub { gap: 4px; font-size: 11px; }
    .sub .dev { display: none; }
    .links { padding: 0 9px 9px; }
    .score { width: 32px; height: 32px; font-size: 14px; }
    .user { width: 26px; height: 26px; font-size: 11px; }
    th.studio, td.studio { display: none; }
    th, td { padding: 8px 8px; font-size: 13px; }
  }
  /* Share mode: the current results as 3:4 frames of 12, each ready to screenshot
     for 小红书 / 小黑盒. Everything inside a frame is sized in cqw so a frame scales
     with the window but keeps its layout. */
  .share-btn { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 13px; font: inherit; font-size: 14px; cursor: pointer; }
  .share-btn:hover { border-color: var(--accent); color: var(--accent); }
  #shareBar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    max-width: 1080px; margin: 0 auto 16px; color: var(--muted); font-size: 13px; }
  body.share header, body.share footer, body.share .count { display: none; }
  .frames { display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .frame-wrap { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .frame-wrap .share-btn { padding: 6px 12px; font-size: 13px; }
  .frame {
    width: min(1080px, calc(100vw - 32px)); aspect-ratio: 3 / 4; container-type: inline-size;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; padding: 3cqw;
  }
  .frame-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 2cqw; margin-bottom: 2.4cqw; }
  .frame-title { font-size: 3.4cqw; font-weight: 700; line-height: 1.25; }
  .frame-title span { color: var(--accent); }
  .frame-sub { font-size: 1.9cqw; color: var(--muted); margin-top: .6cqw; }
  .frame-page { font-size: 1.9cqw; color: var(--muted); white-space: nowrap; }
  .frame-grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 2cqw; min-height: 0; }
  .fcard { background: var(--panel); border: 1px solid var(--line); border-radius: 1.2cqw; overflow: hidden;
    display: flex; flex-direction: column; min-height: 0; }
  .fcard .fart { position: relative; flex: 1; min-height: 0; background: var(--panel-2); }
  .fcard .fart img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fcard .frank { position: absolute; left: .8cqw; bottom: .8cqw; background: rgba(0,0,0,.75);
    border-radius: .6cqw; padding: .1cqw .7cqw; font-size: 1.5cqw; color: #c9d1d9; }
  .fcard .fscores { position: absolute; right: .8cqw; bottom: .8cqw; display: flex; gap: .6cqw; align-items: center; }
  .fcard .fscore { min-width: 4.4cqw; height: 4.4cqw; border-radius: .9cqw; display: grid; place-items: center;
    font-weight: 700; font-size: 2.2cqw; color: #05140c; }
  .fcard .fuser { width: 3.6cqw; height: 3.6cqw; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: 1.5cqw; color: #05140c; }
  .fscore.good, .fuser.good { background: var(--good); } .fscore.mixed, .fuser.mixed { background: var(--mixed); }
  .fscore.bad, .fuser.bad { background: var(--bad); color: #2a0409; }
  .fcard .fbody { padding: 1cqw 1.1cqw 1.2cqw; }
  .fcard .fname { font-size: 1.9cqw; font-weight: 600; line-height: 1.3; height: 2.6em; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .fcard .ftags { display: flex; gap: .6cqw; margin-top: .6cqw; font-size: 1.4cqw; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .fcard .ftags span { border: 1px solid var(--line); border-radius: .5cqw; padding: 0 .6cqw; }
  .fcard .ftags .tier-2 { color: #79b8ff; border-color: #24476e; }
  .fcard .ftags .tier-3 { color: #e3b341; border-color: #6b5317; }
  .frame-foot { display: flex; justify-content: space-between; margin-top: 2cqw; font-size: 1.7cqw; color: var(--muted); }
  .frame-foot b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="titlebar">
      <h1 id="h1"></h1>
      <div class="meta" id="meta"></div>
      <div class="seg lang" id="service">
        <button data-v="xgp" aria-pressed="false">Xbox Game Pass</button>
        <button data-v="psplus" aria-pressed="false">PS Plus</button>
      </div>
      <div class="seg" id="lang">
        <button data-v="zh" aria-pressed="false">中文</button>
        <button data-v="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Search title, studio, genre…" autocomplete="off">
      <button class="filters-toggle" id="filtersToggle" aria-expanded="false" data-i18n="filters"></button>
      <select id="sort">
        <option value="score-desc" data-i18n="sortScoreDesc"></option>
        <option value="score-asc" data-i18n="sortScoreAsc"></option>
        <option value="user-desc" data-i18n="sortUserDesc"></option>
        <option value="date-desc" data-i18n="sortNewest"></option>
        <option value="date-asc" data-i18n="sortOldest"></option>
        <option value="title-asc" data-i18n="sortTitle"></option>
      </select>
      <div class="playon" id="platform">
        <span class="playon-label" data-i18n="playOn"></span>
        <label data-service="xgp"><input type="checkbox" value="xboxSeries"> <span data-i18n="devSeries"></span></label>
        <label data-service="xgp"><input type="checkbox" value="xboxOne"> <span data-i18n="devOne"></span></label>
        <label data-service="xgp"><input type="checkbox" value="pc"> <span data-i18n="devPc"></span></label>
        <label data-service="xgp" data-i18n-title="handheldHint"><input type="checkbox" value="handheld"> <span data-i18n="devHandheld"></span></label>
        <label data-service="xgp"><input type="checkbox" value="playAnywhere"> <span data-i18n="devXpa"></span></label>
        <label data-service="psplus"><input type="checkbox" value="ps5"> <span data-i18n="devPs5"></span></label>
        <label data-service="psplus"><input type="checkbox" value="ps5Native"> <span data-i18n="devPs5Native"></span></label>
        <label data-service="psplus"><input type="checkbox" value="ps4"> <span data-i18n="devPs4"></span></label>
      </div>
      <select id="tier" data-service="psplus">
        <option value="0" data-i18n="tierAny"></option>
        <option value="1" data-i18n="tierEssential"></option>
        <option value="2" data-i18n="tierExtra"></option>
        <option value="3" data-i18n="tierPremium"></option>
      </select>
      <select id="min">
        <option value="0" data-i18n="anyScore"></option>
        <option value="90" data-i18n="score90"></option>
        <option value="80">80+</option>
        <option value="75" data-i18n="score75"></option>
        <option value="60">60+</option>
      </select>
      <select id="minUser">
        <option value="0" data-i18n="anyUser"></option>
        <option value="8" data-i18n="user8"></option>
        <option value="7.5">7.5+</option>
        <option value="7">7.0+</option>
        <option value="6">6.0+</option>
      </select>
      <select id="since">
        <option value="0" data-i18n="anyYear"></option>
        <option value="2025" data-i18n="since" data-year="2025"></option>
        <option value="2023" data-i18n="since" data-year="2023"></option>
        <option value="2020" data-i18n="since" data-year="2020"></option>
        <option value="2015" data-i18n="since" data-year="2015"></option>
        <option value="2010" data-i18n="since" data-year="2010" selected></option>
      </select>
      <label class="toggle"><input type="checkbox" id="unrated"> <span data-i18n="unrated"></span></label>
      <div class="seg" id="view">
        <button data-v="grid" aria-pressed="true" data-i18n="viewGrid"></button>
        <button data-v="list" aria-pressed="false" data-i18n="viewList"></button>
      </div>
      <button class="share-btn" id="shareOn" data-i18n="shareOn"></button>
    </div>
  </div>
</header>

<main>
  <div id="shareBar" hidden>
    <button class="share-btn" id="shareOff" data-i18n="shareOff"></button>
    <button class="share-btn" id="shareAll" data-i18n="shareAll"></button>
    <span data-i18n="shareHint"></span>
  </div>
  <div class="count" id="count"></div>
  <div id="out"></div>
</main>

<footer id="footer"></footer>

<script>
const I18N = {
  zh: {
    title: {
      xgp: 'Xbox Game Pass 游戏库 · 按 <span>Metacritic</span> 评分排序',
      psplus: 'PlayStation Plus 游戏库 · 按 <span>Metacritic</span> 评分排序',
    },
    tierAny: '我的会员：全部档位',
    tierEssential: '我有 Essential（一档）', tierExtra: '我有 Extra（二档）', tierPremium: '我有 Premium（三档）',
    tierName: { 1: 'Essential', 2: 'Extra', 3: 'Premium' },
    tierTip: '最低需要的 PS Plus 档位',
    meta: (n, s, m, d) => `${n} 款游戏 · ${s} 款有评分 · ${m} 区目录 · 更新于 ${d}`,
    search: '搜索游戏名、开发商、类型…',
    sortScoreDesc: '评分从高到低', sortScoreAsc: '评分从低到高',
    sortUserDesc: '玩家评分从高到低',
    sortNewest: '最新发售', sortOldest: '最早发售', sortTitle: '名称 A–Z',
    anyUser: '不限玩家评分', user8: '8.0+ · 玩家力荐',
    criticScoreTip: '媒体评分（满分 100）',
    userScoreTip: (n) => `玩家评分（满分 10）· ${n ?? 0} 条评价`,
    thUser: '玩家',
    playOn: '可玩平台',
    devSeries: 'Xbox Series X|S', devOne: 'Xbox One', devPc: 'Windows PC',
    devPs5: 'PS5（含兼容 PS4）', devPs5Native: 'PS5 原生', devPs4: 'PS4',
    devHandheld: '掌机', devXpa: 'Play Anywhere',
    handheldHint: '微软官网的「掌机」筛选直接复用 PC 目录，结果与 Windows PC 相同',
    anyScore: '不限评分', score90: '90+ · 普遍赞誉', score75: '75+ · 好评',
    anyYear: '不限年份', since: (y) => `${y} 年及以后`,
    shareOn: '生成分享图', shareOff: '← 返回', shareHint: '每张 3:4、12 款游戏，1080×1440，可直接发小红书 / 小黑盒。按 Esc 返回。',
    shareAll: '下载全部', shareOne: (i) => `下载第 ${i} 张`, shareBusy: '生成中…', shareFail: '生成图片失败，可以改用截图',
    shareService: { xgp: 'XGP', psplus: 'PS Plus' },
    shareTier: { 1: '一档 Essential', 2: '二档 Extra', 3: '三档 Premium' },
    shareCritic: (n) => `媒体评分 ${n}+`, shareUser: (n) => `玩家评分 ${n}+`, shareSince: (y) => `${y} 年后`,
    shareQuery: (q) => `搜索「${q}」`, shareHeading: (parts) => parts.join(' · '),
    shareCount: (n, sort) => `共 ${n} 款 · ${sort}`, sharePage: (i, n) => `${i} / ${n}`,
    shareLegend: '<b>方块</b> 媒体评分 · <b>圆圈</b> 玩家评分（Metacritic）',
    unrated: '包含无评分作品', viewGrid: '封面', viewList: '列表', filters: '筛选', filtersClose: '收起',
    count: (n, total, scoredOnly, since) =>
      `共 ${total} 款中的 ${n} 款` + (scoredOnly ? '（有 Metacritic 评分）' : '') + (since ? ` · ${since} 年及以后` : ''),
    empty: '没有符合条件的游戏',
    store: '商店', mc: 'Metacritic', mcShort: 'M 站',
    thRank: '#', thScore: '评分', thTitle: '游戏', thStudio: '开发商', thYear: '年份', thPlat: '平台', thLinks: '链接',
    footer: {
      xgp: '目录来自微软 Game Pass 公开接口 · 媒体与玩家评分来自 Metacritic · 游戏按名称匹配，少数可能缺失或指向重制版 · 中文名来自商店、Steam 与 Wikidata，统一为简体。运行 <code>npm run build</code> 可刷新数据。',
      psplus: '目录来自 playstation.com 的 PS Plus 游戏查找接口 · Essential 为每月游戏（每月轮换），Extra 加游戏目录与 Ubisoft Classics，Premium 再加经典目录 · 评分来自 Metacritic，按名称匹配 · 中文名来自商店、Steam 与 Wikidata，统一为简体。运行 <code>npm run build</code> 可刷新数据。',
    },
  },
  en: {
    title: {
      xgp: 'Xbox Game Pass, ranked by <span>Metacritic</span>',
      psplus: 'PlayStation Plus, ranked by <span>Metacritic</span>',
    },
    tierAny: 'My plan: any tier',
    tierEssential: 'I have Essential', tierExtra: 'I have Extra', tierPremium: 'I have Premium',
    tierName: { 1: 'Essential', 2: 'Extra', 3: 'Premium' },
    tierTip: 'Lowest PS Plus plan that includes this game',
    meta: (n, s, m, d) => `${n} games · ${s} scored · ${m} catalog · updated ${d}`,
    search: 'Search title, studio, genre…',
    sortScoreDesc: 'Metacritic ↓', sortScoreAsc: 'Metacritic ↑',
    sortUserDesc: 'User score ↓',
    sortNewest: 'Newest first', sortOldest: 'Oldest first', sortTitle: 'Title A–Z',
    anyUser: 'Any user score', user8: '8.0+ · Player favourite',
    criticScoreTip: 'Critic score (out of 100)',
    userScoreTip: (n) => `User score (out of 10) · ${n ?? 0} ratings`,
    thUser: 'Users',
    playOn: 'Play on',
    devSeries: 'Xbox Series X|S', devOne: 'Xbox One', devPc: 'Windows PC',
    devPs5: 'PS5 (incl. PS4 games)', devPs5Native: 'PS5 native', devPs4: 'PS4',
    devHandheld: 'Handhelds', devXpa: 'Play Anywhere',
    handheldHint: "Xbox serves the Handhelds facet from the PC catalog, so it matches Windows PC",
    anyScore: 'Any score', score90: '90+ · Universal acclaim', score75: '75+ · Generally favorable',
    anyYear: 'Any year', since: (y) => `${y} or newer`,
    shareOn: 'Share images', shareOff: '← Back', shareHint: 'Each frame is 3:4 (1080×1440) with 12 games. Press Esc to go back.',
    shareAll: 'Download all', shareOne: (i) => `Download image ${i}`, shareBusy: 'Rendering…', shareFail: 'Could not render the image; take a screenshot instead',
    shareService: { xgp: 'Game Pass', psplus: 'PS Plus' },
    shareTier: { 1: 'Essential', 2: 'Extra', 3: 'Premium' },
    shareCritic: (n) => `Critics ${n}+`, shareUser: (n) => `Users ${n}+`, shareSince: (y) => `${y}+`,
    shareQuery: (q) => `“${q}”`, shareHeading: (parts) => parts.join(' · '),
    shareCount: (n, sort) => `${n} games · ${sort}`, sharePage: (i, n) => `${i} / ${n}`,
    shareLegend: '<b>Square</b> critic score · <b>circle</b> user score (Metacritic)',
    unrated: 'Include unrated', viewGrid: 'Grid', viewList: 'List', filters: 'Filters', filtersClose: 'Done',
    count: (n, total, scoredOnly, since) =>
      `${n} of ${total} titles` + (scoredOnly ? ' with a Metacritic score' : '') + (since ? ` · released ${since} or later` : ''),
    empty: 'Nothing matches those filters.',
    store: 'Store', mc: 'Metacritic', mcShort: 'MC',
    thRank: '#', thScore: 'Score', thTitle: 'Title', thStudio: 'Studio', thYear: 'Year', thPlat: 'Platform', thLinks: 'Links',
    footer: {
      xgp: "Catalog from Microsoft's public Game Pass catalog API · critic and user scores from Metacritic · titles are matched by name, so a handful may be missing or point at a re-release. Regenerate with <code>npm run build</code>.",
      psplus: "Catalog from playstation.com's PS Plus game finder · Essential is the monthly games (they rotate), Extra adds the Game Catalog and Ubisoft Classics, Premium adds the Classics Catalog · scores from Metacritic, matched by name. Regenerate with <code>npm run build</code>.",
    },
  },
};

const pickLang = () => {
  try {
    const saved = localStorage.getItem('xgp-lang');
    if (saved === 'zh' || saved === 'en') return saved;
  } catch {}
  return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
};

let t = I18N.zh;
const state = { q: '', sort: 'score-desc', playOn: [], min: 0, minUser: 0, since: 0, unrated: false, view: 'grid', lang: 'zh', service: 'xgp', tier: 0 };
state.share = false;
// Default to 2010 onward: older titles are a pick-"any year" opt-in, not the first view.
state.since = 2010;

const SERVICE_DATA = { xgp: 'data/games.json', psplus: 'data/psplus-games.json' };
const datasets = {};

// xbox.com's own facets. "handheld" is not a distinct catalog flag there — the
// site filters it against the PC list, so it resolves to the same predicate.
const PLAY_ON = {
  xboxSeries: (g) => g.xboxSeries,
  xboxOne: (g) => g.xboxOne,
  pc: (g) => g.platforms.includes('pc'),
  handheld: (g) => g.platforms.includes('pc'),
  playAnywhere: (g) => g.playAnywhere,
  // PS5 plays PS4 games (and the emulated classics), so "PS5" means playable on
  // one; ps5Native is for people who only want the native PS5 versions.
  ps5: (g) => g.ps5 || g.ps4,
  ps5Native: (g) => g.ps5,
  ps4: (g) => g.ps4,
};
let games = [];

const band = (s) => s == null ? 'none' : s >= 75 ? 'good' : s >= 50 ? 'mixed' : 'bad';
const year = (d) => (d ? String(d).slice(0, 4) : '');

// The store date is often a re-release or the Game Pass listing date — GoldenEye 007
// is listed as 2023 but is a 1997 game. Metacritic's date is the original release,
// which is what "too old" actually means.
// The user score is a 0-10 scale; Metacritic's own thresholds are 7.5 / 5.0.
const userBand = (u) => u == null ? 'none' : u >= 7.5 ? 'good' : u >= 5 ? 'mixed' : 'bad';
const fmtUser = (u) => (u == null ? '–' : u.toFixed(1));

const gameYear = (g) => Number(year(g.metacritic?.releaseDate) || year(g.releaseDate)) || null;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function visible() {
  const q = state.q.trim().toLowerCase();
  return games.filter((g) => {
    const score = g.metacritic?.score ?? null;
    if (score == null && !state.unrated) return false;
    if (score != null && score < state.min) return false;
    if (score == null && state.min > 0) return false;
    // Checking several devices widens the result set, matching the store's behaviour.
    if (state.playOn.length && !state.playOn.some((k) => PLAY_ON[k](g))) return false;
    if (state.since && !(g.year >= state.since)) return false;
    // PS Plus plans are cumulative: Extra includes everything in Essential.
    if (state.service === 'psplus' && state.tier && !(g.tier <= state.tier)) return false;
    if (state.minUser && !(g.metacritic?.userScore >= state.minUser)) return false;
    if (!q) return true;
    return g.searchText.includes(q);
  }).sort(cmp);
}

// zh-Hans collation orders Chinese titles by pinyin rather than code point.
const collator = () => new Intl.Collator(state.lang === 'zh' ? 'zh-Hans' : 'en');
const byTitle = (a, b) => collator().compare(displayTitle(a), displayTitle(b));

function cmp(a, b) {
  const sa = a.metacritic?.score, sb = b.metacritic?.score;
  switch (state.sort) {
    case 'user-desc': return (b.metacritic?.userScore ?? -1) - (a.metacritic?.userScore ?? -1) || byTitle(a, b);
    case 'score-desc': return (sb ?? -1) - (sa ?? -1) || byTitle(a, b);
    case 'score-asc': return (sa ?? 1e3) - (sb ?? 1e3) || byTitle(a, b);
    case 'date-desc': return (b.year ?? -1) - (a.year ?? -1) || byTitle(a, b);
    case 'date-asc': return (a.year ?? 1e4) - (b.year ?? 1e4) || byTitle(a, b);
    default: return byTitle(a, b);
  }
}

// Only ~40% of the catalog ships a Chinese title; the rest stay English.
const displayTitle = (g) => (state.lang === 'zh' && g.titleZh) || g.title;

function deviceTags(g) {
  const tags = [];
  if (g.xboxSeries) tags.push('X|S');
  if (g.xboxOne) tags.push('One');
  if (g.platforms.includes('pc')) tags.push('PC');
  if (g.playAnywhere) tags.push('XPA');
  if (g.ps5) tags.push('PS5');
  if (g.ps4) tags.push('PS4');
  return tags;
}

const tierTag = (g) => g.tier
  ? `<span class="tag tier-${g.tier}" title="${t.tierTip}">${t.tierName[g.tier]}</span>` : '';

function renderGrid(list) {
  return `<div class="grid">${list.map((g, i) => {
    const s = g.metacritic?.score ?? null;
    const u = g.metacritic?.userScore ?? null;
    return `<article class="card">
      <div class="art">
        ${g.image ? `<img loading="lazy" src="${esc(g.image)}" alt="">` : ''}
        <div class="rank">#${i + 1}</div>
        <div class="scores">
          ${u != null ? `<div class="user ${userBand(u)}" title="${t.userScoreTip(g.metacritic.userReviewCount)}">${fmtUser(u)}</div>` : ''}
          <div class="score ${band(s)}" title="${t.criticScoreTip}">${s ?? '–'}</div>
        </div>
      </div>
      <div class="body">
        <div class="name">${esc(displayTitle(g))}
          ${state.lang === 'zh' && g.titleZh ? `<div class="name-sub">${esc(g.title)}</div>` : ''}</div>
        <div class="sub">
          ${g.developer ? `<span class="dev">${esc(g.developer)}</span>` : ''}
          ${g.year ? `<span class="tag">${g.year}</span>` : ''}
          ${tierTag(g)}
          ${deviceTags(g).map((t) => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
      <div class="links">
        <a href="${esc(g.storeUrl)}" target="_blank" rel="noopener">${t.store}</a>
        ${g.metacritic ? `<a href="${esc(g.metacritic.url)}" target="_blank" rel="noopener">${t.mc}</a>` : ''}
      </div>
    </article>`;
  }).join('')}</div>`;
}

function renderList(list) {
  return `<div class="table-wrap"><table><thead><tr>
      <th class="num">${t.thRank}</th><th>${t.thScore}</th><th>${t.thUser}</th><th>${t.thTitle}</th>
      <th class="studio">${t.thStudio}</th><th>${t.thYear}</th><th>${t.thPlat}</th><th>${t.thLinks}</th>
    </tr></thead><tbody>${list.map((g, i) => {
    const s = g.metacritic?.score ?? null;
    const u = g.metacritic?.userScore ?? null;
    return `<tr>
      <td class="num">${i + 1}</td>
      <td class="mc"><span class="pill ${band(s)}">${s ?? '–'}</span></td>
      <td class="mc"><span class="pill user ${userBand(u)}">${fmtUser(u)}</span></td>
      <td>${esc(displayTitle(g))}</td>
      <td class="studio" style="color:var(--muted)">${esc(g.developer || '')}</td>
      <td style="color:var(--muted)">${g.year ?? ''}</td>
      <td style="color:var(--muted)">${tierTag(g)} ${deviceTags(g).join(' · ')}</td>
      <td><span class="links" style="padding:0">
        <a href="${esc(g.storeUrl)}" target="_blank" rel="noopener">${t.store}</a>
        ${g.metacritic ? `<a href="${esc(g.metacritic.url)}" target="_blank" rel="noopener">${t.mcShort}</a>` : ''}
      </span></td>
    </tr>`;
  }).join('')}</tbody></table></div>`;
}

// Share mode splits the results into 3:4 frames of 12 cards (4 × 3), headed by the
// active filters so a screenshot explains itself.
const PER_FRAME = 12;

function shareHeading() {
  const parts = [t.shareService[state.service]];
  if (state.service === 'psplus' && state.tier) parts.push(t.shareTier[state.tier]);
  for (const input of document.querySelectorAll('#platform input:checked')) {
    parts.push(input.closest('label').textContent.trim());
  }
  if (state.min) parts.push(t.shareCritic(state.min));
  if (state.minUser) parts.push(t.shareUser(state.minUser));
  if (state.since) parts.push(t.shareSince(state.since));
  if (state.q.trim()) parts.push(t.shareQuery(state.q.trim()));
  return t.shareHeading(parts);
}

function renderShare(list) {
  const sortLabel = document.getElementById('sort').selectedOptions[0]?.textContent || '';
  const pages = Math.max(1, Math.ceil(list.length / PER_FRAME));
  const date = datasets[state.service]?.meta?.date || '';
  const frames = [];
  for (let p = 0; p < pages; p++) {
    const cards = list.slice(p * PER_FRAME, (p + 1) * PER_FRAME).map((g, i) => {
      const s = g.metacritic?.score ?? null;
      const u = g.metacritic?.userScore ?? null;
      const tags = [g.year, ...deviceTags(g).filter((d) => d !== 'XPA')].filter(Boolean)
        .map((x) => `<span>${x}</span>`).join('');
      const tier = g.tier ? `<span class="tier-${g.tier}">${t.tierName[g.tier]}</span>` : '';
      return `<div class="fcard">
        <div class="fart">
          ${g.image ? `<img crossorigin="anonymous" src="${esc(shareCover(g))}" alt="">` : ''}
          <div class="frank">#${p * PER_FRAME + i + 1}</div>
          <div class="fscores">
            ${u != null ? `<div class="fuser ${userBand(u)}">${fmtUser(u)}</div>` : ''}
            <div class="fscore ${band(s)}">${s ?? '–'}</div>
          </div>
        </div>
        <div class="fbody">
          <div class="fname">${esc(displayTitle(g))}</div>
          <div class="ftags">${tier}${tags}</div>
        </div>
      </div>`;
    }).join('');
    frames.push(`<div class="frame-wrap">
    <button class="share-btn" data-download="${p}">${t.shareOne(p + 1)}</button>
    <section class="frame">
      <div class="frame-head">
        <div>
          <div class="frame-title">${esc(shareHeading())}</div>
          <div class="frame-sub">${esc(t.shareCount(list.length, sortLabel))}</div>
        </div>
        ${pages > 1 ? `<div class="frame-page">${t.sharePage(p + 1, pages)}</div>` : ''}
      </div>
      <div class="frame-grid">${cards}</div>
      <div class="frame-foot"><span>${t.shareLegend}</span><span><b>games.vim0.com</b> · ${date}</span></div>
    </section></div>`);
  }
  return `<div class="frames">${frames.join('')}</div>`;
}

// Covers must be CORS-readable to be drawn into a downloaded PNG. Xbox's CDN allows
// that (and resizes with ?w=); PlayStation's does not, so PS covers are served
// from this site's covers/ps/ (see scripts/fetch-covers.mjs).
const shareCover = (g) => state.service === 'psplus'
  ? `covers/ps/${g.coverId ?? g.productId}.jpg`
  : `${g.image}?w=300`;

// modern-screenshot is vendored and only loaded the first time someone downloads.
let screenshotLib;
function loadScreenshotLib() {
  screenshotLib ??= new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'vendor/modern-screenshot.js';
    script.onload = () => resolve(window.modernScreenshot);
    script.onerror = reject;
    document.head.appendChild(script);
  });
  return screenshotLib;
}

async function downloadFrame(index) {
  const frame = document.querySelectorAll('.frame')[index];
  const { domToBlob } = await loadScreenshotLib();
  // Always 1080×1440, whatever size the frame is drawn at on screen.
  const blob = await domToBlob(frame, { scale: 1080 / frame.offsetWidth, type: 'image/png' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `games-vim0-${state.service}-${index + 1}.png`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10_000);
}

async function withBusy(button, task) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = t.shareBusy;
  try { await task(); } catch (err) { console.error(err); alert(t.shareFail); }
  finally { button.disabled = false; button.textContent = label; }
}

function setShare(on) {
  state.share = on;
  document.body.classList.toggle('share', on);
  document.getElementById('shareBar').hidden = !on;
  render();
  window.scrollTo(0, 0);
}

function render() {
  const list = visible();
  document.getElementById('count').textContent =
    t.count(list.length, games.length, !state.unrated, state.since);
  document.getElementById('out').innerHTML = !list.length ? `<div class="empty">${t.empty}</div>`
    : state.share ? renderShare(list)
    : state.view === 'grid' ? renderGrid(list) : renderList(list);
}

function applyLang(lang) {
  state.lang = lang;
  t = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  try { localStorage.setItem('xgp-lang', lang); } catch {}

  document.getElementById('q').placeholder = t.search;
  for (const el of document.querySelectorAll('[data-i18n]')) {
    const v = t[el.dataset.i18n];
    el.textContent = typeof v === 'function' ? v(el.dataset.year) : v;
  }
  for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = t[el.dataset.i18nTitle];
  for (const b of document.getElementById('lang').children) {
    b.setAttribute('aria-pressed', String(b.dataset.v === lang));
  }
  renderChrome();
  render();
}

// Title, footer and meta line depend on both the language and the service.
function renderChrome() {
  document.getElementById('h1').innerHTML = t.title[state.service];
  document.getElementById('footer').innerHTML = t.footer[state.service];
  const m = datasets[state.service]?.meta;
  document.getElementById('meta').textContent = m ? t.meta(m.games, m.scored, m.market, m.date) : '';
}

function bindSeg(id, key) {
  document.getElementById(id).addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state[key] = btn.dataset.v;
    [...e.currentTarget.children].forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    render();
  });
}

// The store lists many games twice (console SKU + PC SKU, PS4 and PS5 concepts,
// regional variants). Collapse them onto the Metacritic entry, or on the title
// when unmatched.
function prepare(data) {
  const merged = new Map();
  for (const g of data.games) {
    const key = g.metacritic?.url || g.title.toLowerCase().replace(/[^a-z0-9]/g, '');
    const prev = merged.get(key);
    if (!prev) { merged.set(key, { ...g, platforms: [...(g.platforms || [])] }); continue; }
    prev.platforms = [...new Set([...prev.platforms, ...(g.platforms || [])])];
    // coverId follows the image, so share mode finds the matching covers/ps/ file.
    if (!prev.image && g.image) { prev.image = g.image; prev.coverId = g.productId; }
    for (const f of ['xboxOne', 'xboxSeries', 'playAnywhere', 'ps4', 'ps5']) prev[f] ||= g[f];
    if (g.tier) prev.tier = Math.min(prev.tier, g.tier);
    if (!prev.titleZh && g.titleZh) prev.titleZh = g.titleZh;
    if (prev.title.length > g.title.length) {
      prev.title = g.title; prev.storeUrl = g.storeUrl;
      if (g.titleZh) prev.titleZh = g.titleZh;
    }
  }
  const games = [...merged.values()].map((g) => ({
    ...g,
    year: gameYear(g),
    searchText: [g.title, g.titleZh, g.developer, g.publisher, ...(g.metacritic?.genres || []), ...g.categories]
      .filter(Boolean).join(' ').toLowerCase(),
  }));
  return {
    games,
    meta: {
      games: games.length,
      scored: games.filter((g) => g.metacritic).length,
      market: data.market,
      date: data.fetchedAt.slice(0, 10),
    },
  };
}

async function setService(service) {
  state.service = service;
  try { localStorage.setItem('xgp-service', service); } catch {}
  for (const b of document.getElementById('service').children) {
    b.setAttribute('aria-pressed', String(b.dataset.v === service));
  }
  for (const el of document.querySelectorAll('[data-service]')) el.hidden = el.dataset.service !== service;
  // Device facets differ per service, so a stale Xbox selection must not filter PS games.
  for (const i of document.querySelectorAll('#platform input')) i.checked = false;
  state.playOn = [];

  if (!datasets[service]) {
    games = [];
    render();
    const res = await fetch(SERVICE_DATA[service]);
    datasets[service] = prepare(await res.json());
  }
  if (state.service !== service) return; // switched again while loading
  games = datasets[service].games;
  renderChrome();
  render();
}

const pickService = () => {
  try {
    const saved = localStorage.getItem('xgp-service');
    if (SERVICE_DATA[saved]) return saved;
  } catch {}
  return 'xgp';
};

(async function init() {
  document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });
  document.getElementById('min').addEventListener('change', (e) => { state.min = +e.target.value; render(); });
  document.getElementById('since').addEventListener('change', (e) => { state.since = +e.target.value; render(); });
  document.getElementById('minUser').addEventListener('change', (e) => { state.minUser = +e.target.value; render(); });
  document.getElementById('tier').addEventListener('change', (e) => { state.tier = +e.target.value; render(); });
  document.getElementById('service').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn && btn.dataset.v !== state.service) setService(btn.dataset.v);
  });
  document.getElementById('unrated').addEventListener('change', (e) => { state.unrated = e.target.checked; render(); });
  document.getElementById('platform').addEventListener('change', (e) => {
    state.playOn = [...e.currentTarget.querySelectorAll('input:checked')].map((i) => i.value);
    render();
  });
  bindSeg('view', 'view');
  document.getElementById('filtersToggle').addEventListener('click', (e) => {
    const header = document.querySelector('header');
    const open = header.classList.toggle('open');
    e.currentTarget.setAttribute('aria-expanded', String(open));
    e.currentTarget.textContent = open ? t.filtersClose : t.filters;
  });
  document.getElementById('shareOn').addEventListener('click', () => setShare(true));
  document.getElementById('shareOff').addEventListener('click', () => setShare(false));
  document.getElementById('shareAll').addEventListener('click', (e) => withBusy(e.currentTarget, async () => {
    const count = document.querySelectorAll('.frame').length;
    for (let i = 0; i < count; i++) await downloadFrame(i);
  }));
  document.getElementById('out').addEventListener('click', (e) => {
    const button = e.target.closest('[data-download]');
    if (button) withBusy(button, () => downloadFrame(Number(button.dataset.download)));
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.share) setShare(false); });
  document.getElementById('lang').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) applyLang(btn.dataset.v);
  });
  applyLang(pickLang());
  await setService(pickService());
})();
</script>
