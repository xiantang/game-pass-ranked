<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Pass, Ranked</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c232c; --line: #2a323d;
    --text: #e6edf3; --muted: #8b949e; --accent: #6dc849;
    --good: #00ce7a; --mixed: #ffbd3f; --bad: #ff6874;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13,17,23,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
  .titlebar { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 16px 0 12px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.2px; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-bottom: 14px; }
  input[type="search"], select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 11px; font: inherit; font-size: 14px;
  }
  input[type="search"] { min-width: 240px; flex: 1 1 240px; }
  input[type="search"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg button {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px;
    padding: 8px 13px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }
  .playon {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 7px 12px;
  }
  .playon-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .playon label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .playon label:has(:checked) { color: var(--accent); }
  .playon input { accent-color: var(--accent); margin: 0; }
  .toggle { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 14px; cursor: pointer; }

  main { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: #3d4753; }
  .art { position: relative; aspect-ratio: 3 / 4; background: var(--panel-2); }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rank {
    position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.72);
    border-radius: 6px; padding: 2px 7px; font-size: 12px; color: var(--muted);
  }
  .score {
    position: absolute; right: 8px; bottom: 8px; width: 38px; height: 38px;
    border-radius: 8px; display: grid; place-items: center;
    font-weight: 700; font-size: 16px; color: #05140c;
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
  }
  .score.good { background: var(--good); }
  .score.mixed { background: var(--mixed); }
  .score.bad { background: var(--bad); color: #2a0409; }
  .score.none { background: var(--panel-2); color: var(--muted); font-size: 13px; box-shadow: none; }
  .body { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 5px; }
  .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .sub { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: 11px; }
  .links { margin-top: auto; padding: 0 11px 11px; display: flex; gap: 8px; font-size: 12px; }
  .links a { color: var(--muted); border-bottom: 1px solid transparent; }
  .links a:hover { color: var(--accent); border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr:hover { background: var(--panel); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); width: 52px; }
  td.mc { font-weight: 700; width: 64px; }
  td.mc .pill { display: inline-block; min-width: 34px; text-align: center; border-radius: 6px; padding: 2px 0; color: #05140c; }
  .pill.good { background: var(--good); } .pill.mixed { background: var(--mixed); }
  .pill.bad { background: var(--bad); color: #2a0409; } .pill.none { background: var(--panel-2); color: var(--muted); }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  footer { color: var(--muted); font-size: 12px; padding: 30px 20px 50px; max-width: 1400px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="titlebar">
      <h1>Xbox Game Pass, ranked by <span>Metacritic</span></h1>
      <div class="meta" id="meta">loading…</div>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Search title, studio, genre…" autocomplete="off">
      <select id="sort">
        <option value="score-desc">Metacritic ↓</option>
        <option value="score-asc">Metacritic ↑</option>
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="title-asc">Title A–Z</option>
      </select>
      <div class="playon" id="platform">
        <span class="playon-label">Play on</span>
        <label><input type="checkbox" value="xboxSeries"> Xbox Series X|S</label>
        <label><input type="checkbox" value="xboxOne"> Xbox One</label>
        <label><input type="checkbox" value="pc"> Windows PC</label>
        <label title="Xbox serves the Handhelds facet from the PC catalog"><input type="checkbox" value="handheld"> Handhelds</label>
        <label><input type="checkbox" value="playAnywhere"> Play Anywhere</label>
      </div>
      <select id="min">
        <option value="0">Any score</option>
        <option value="90">90+ · Universal acclaim</option>
        <option value="80">80+</option>
        <option value="75">75+ · Generally favorable</option>
        <option value="60">60+</option>
      </select>
      <select id="since">
        <option value="0">Any year</option>
        <option value="2025">2025 or newer</option>
        <option value="2023">2023 or newer</option>
        <option value="2020">2020 or newer</option>
        <option value="2015">2015 or newer</option>
        <option value="2010">2010 or newer</option>
      </select>
      <label class="toggle"><input type="checkbox" id="unrated"> Include unrated</label>
      <div class="seg" id="view">
        <button data-v="grid" aria-pressed="true">Grid</button>
        <button data-v="list" aria-pressed="false">List</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="count" id="count"></div>
  <div id="out"></div>
</main>

<footer>
  Catalog from Microsoft's public Game Pass catalog API · scores from Metacritic ·
  titles are matched by name, so a handful may be missing or point at a re-release.
  Regenerate with <code>npm run build</code>.
</footer>

<script>
const state = { q: '', sort: 'score-desc', playOn: [], min: 0, since: 0, unrated: false, view: 'grid' };

// xbox.com's own facets. "handheld" is not a distinct catalog flag there — the
// site filters it against the PC list, so it resolves to the same predicate.
const PLAY_ON = {
  xboxSeries: (g) => g.xboxSeries,
  xboxOne: (g) => g.xboxOne,
  pc: (g) => g.platforms.includes('pc'),
  handheld: (g) => g.platforms.includes('pc'),
  playAnywhere: (g) => g.playAnywhere,
};
let games = [];

const band = (s) => s == null ? 'none' : s >= 75 ? 'good' : s >= 50 ? 'mixed' : 'bad';
const year = (d) => (d ? String(d).slice(0, 4) : '');

// The store date is often a re-release or the Game Pass listing date — GoldenEye 007
// is listed as 2023 but is a 1997 game. Metacritic's date is the original release,
// which is what "too old" actually means.
const gameYear = (g) => Number(year(g.metacritic?.releaseDate) || year(g.releaseDate)) || null;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function visible() {
  const q = state.q.trim().toLowerCase();
  return games.filter((g) => {
    const score = g.metacritic?.score ?? null;
    if (score == null && !state.unrated) return false;
    if (score != null && score < state.min) return false;
    if (score == null && state.min > 0) return false;
    // Checking several devices widens the result set, matching the store's behaviour.
    if (state.playOn.length && !state.playOn.some((k) => PLAY_ON[k](g))) return false;
    if (state.since && !(g.year >= state.since)) return false;
    if (!q) return true;
    return g.searchText.includes(q);
  }).sort(cmp);
}

function cmp(a, b) {
  const sa = a.metacritic?.score, sb = b.metacritic?.score;
  switch (state.sort) {
    case 'score-desc': return (sb ?? -1) - (sa ?? -1) || a.title.localeCompare(b.title);
    case 'score-asc': return (sa ?? 1e3) - (sb ?? 1e3) || a.title.localeCompare(b.title);
    case 'date-desc': return (b.year ?? -1) - (a.year ?? -1) || a.title.localeCompare(b.title);
    case 'date-asc': return (a.year ?? 1e4) - (b.year ?? 1e4) || a.title.localeCompare(b.title);
    default: return a.title.localeCompare(b.title);
  }
}

function deviceTags(g) {
  const tags = [];
  if (g.xboxSeries) tags.push('X|S');
  if (g.xboxOne) tags.push('One');
  if (g.platforms.includes('pc')) tags.push('PC');
  if (g.playAnywhere) tags.push('XPA');
  return tags;
}

function renderGrid(list) {
  return `<div class="grid">${list.map((g, i) => {
    const s = g.metacritic?.score ?? null;
    return `<article class="card">
      <div class="art">
        ${g.image ? `<img loading="lazy" src="${esc(g.image)}" alt="">` : ''}
        <div class="rank">#${i + 1}</div>
        <div class="score ${band(s)}">${s ?? '–'}</div>
      </div>
      <div class="body">
        <div class="name">${esc(g.title)}</div>
        <div class="sub">
          ${g.developer ? esc(g.developer) : ''}
          ${g.year ? `<span class="tag">${g.year}</span>` : ''}
          ${deviceTags(g).map((t) => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
      <div class="links">
        <a href="${esc(g.storeUrl)}" target="_blank" rel="noopener">Store</a>
        ${g.metacritic ? `<a href="${esc(g.metacritic.url)}" target="_blank" rel="noopener">Metacritic</a>` : ''}
      </div>
    </article>`;
  }).join('')}</div>`;
}

function renderList(list) {
  return `<table><thead><tr>
      <th class="num">#</th><th>Score</th><th>Title</th><th>Studio</th><th>Year</th><th>Platform</th><th>Links</th>
    </tr></thead><tbody>${list.map((g, i) => {
    const s = g.metacritic?.score ?? null;
    return `<tr>
      <td class="num">${i + 1}</td>
      <td class="mc"><span class="pill ${band(s)}">${s ?? '–'}</span></td>
      <td>${esc(g.title)}</td>
      <td style="color:var(--muted)">${esc(g.developer || '')}</td>
      <td style="color:var(--muted)">${g.year ?? ''}</td>
      <td style="color:var(--muted)">${deviceTags(g).join(' · ')}</td>
      <td><span class="links" style="padding:0">
        <a href="${esc(g.storeUrl)}" target="_blank" rel="noopener">Store</a>
        ${g.metacritic ? `<a href="${esc(g.metacritic.url)}" target="_blank" rel="noopener">MC</a>` : ''}
      </span></td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

function render() {
  const list = visible();
  document.getElementById('count').textContent =
    `${list.length} of ${games.length} titles`
    + (state.unrated ? '' : ' with a Metacritic score')
    + (state.since ? ` · released ${state.since} or later` : '');
  document.getElementById('out').innerHTML = list.length
    ? (state.view === 'grid' ? renderGrid(list) : renderList(list))
    : '<div class="empty">Nothing matches those filters.</div>';
}

function bindSeg(id, key) {
  document.getElementById(id).addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state[key] = btn.dataset.v;
    [...e.currentTarget.children].forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    render();
  });
}

(async function init() {
  const res = await fetch('data/games.json');
  const data = await res.json();

  // The store lists many games twice (console SKU + PC SKU, or regional variants).
  // Collapse them onto the Metacritic entry, or on the title when unmatched.
  const merged = new Map();
  for (const g of data.games) {
    const key = g.metacritic?.url || g.title.toLowerCase().replace(/[^a-z0-9]/g, '');
    const prev = merged.get(key);
    if (!prev) { merged.set(key, { ...g, platforms: [...g.platforms] }); continue; }
    prev.platforms = [...new Set([...prev.platforms, ...g.platforms])];
    if (!prev.image && g.image) prev.image = g.image;
    for (const f of ['xboxOne', 'xboxSeries', 'playAnywhere']) prev[f] ||= g[f];
    if (prev.title.length > g.title.length) { prev.title = g.title; prev.storeUrl = g.storeUrl; }
  }
  games = [...merged.values()].map((g) => ({
    ...g,
    year: gameYear(g),
    searchText: [g.title, g.developer, g.publisher, ...(g.metacritic?.genres || []), ...g.categories]
      .filter(Boolean).join(' ').toLowerCase(),
  }));

  const scored = games.filter((g) => g.metacritic).length;
  document.getElementById('meta').textContent =
    `${games.length} games · ${scored} scored · ${data.market} catalog · updated ${data.fetchedAt.slice(0, 10)}`;

  document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });
  document.getElementById('min').addEventListener('change', (e) => { state.min = +e.target.value; render(); });
  document.getElementById('since').addEventListener('change', (e) => { state.since = +e.target.value; render(); });
  document.getElementById('unrated').addEventListener('change', (e) => { state.unrated = e.target.checked; render(); });
  document.getElementById('platform').addEventListener('change', (e) => {
    state.playOn = [...e.currentTarget.querySelectorAll('input:checked')].map((i) => i.value);
    render();
  });
  bindSeg('view', 'view');
  render();
})();
</script>
</body>
</html>
